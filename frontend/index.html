<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>초콜릿 운영관리</title>
<link rel="manifest" href="/chocolate/manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="초콜릿">
<link rel="apple-touch-icon" href="/chocolate/chocolate_gold2_192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Sans KR',system-ui,sans-serif;font-weight:700;font-size:20px;background:#3f3f3f;color:#fff;display:flex;justify-content:center}

/* ── App shell ── */
#app{display:flex;flex-direction:column;width:100%;max-width:390px;height:100svh;background:#000;box-shadow:0 0 40px rgba(0,0,0,.8);overflow:hidden;position:relative}
#hdr{background:#000;border-bottom:1px solid #1f2937;padding:18px 20px 14px;flex-shrink:0}
#hdr h1{font-size:22px;font-weight:900;color:#fff}
#hdr-sub{font-size:17px;font-weight:700;color:#9ca3af;margin-top:4px;display:flex;justify-content:space-between;align-items:center}
#content{flex:1;overflow-y:auto;padding-bottom:72px;scrollbar-width:none}
#content::-webkit-scrollbar{display:none}
#tabbar{position:absolute;bottom:0;left:0;right:0;background:#000;border-top:1px solid #1f2937;display:flex;z-index:100}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 8px;cursor:pointer}
.tab .ti{font-size:24px}
.tab .tl{font-size:15px;font-weight:700;color:#9ca3af;margin-top:2px}
.tab.on .tl{color:#fbbf24}

/* ── Pages ── */
.page{display:none;padding:14px}
.page.on{display:block}

/* ── Card ── */
.card{background:#111827;border:1px solid #1f2937;border-radius:6px;padding:14px;margin-bottom:12px}
.card-ttl{font-size:18px;font-weight:900;color:#fff;margin-bottom:12px}

/* ── Stats table ── */
.stat-table{background:#111827;border:1px solid #1f2937;border-radius:8px;margin-bottom:12px;overflow:hidden}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px}
.stat-row+.stat-row{border-top:1px solid #1f2937}
.stat-lbl{font-size:17px;font-weight:700;color:#9ca3af}
.stat-val{font-size:21px;font-weight:900;color:#fff}
.stat-val.amber{color:#fbbf24}
.stat-val.red{color:#f87171}
.stat-val.green{color:#4ade80}
.stat-val.blue{color:#60a5fa}

/* ── Weekly grid ── */
.wk-grid{background:#111827;border:1px solid #1f2937;border-radius:8px;overflow:hidden;margin-bottom:12px}
.wk-row{display:grid;grid-template-columns:42px 1fr 1fr 1fr}
.wk-row+.wk-row{border-top:1px solid #1f2937}
.wk-hdr-row{background:#0d1117}
.wk-cell{padding:11px 4px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.wk-col-head,.wk-row-head{color:#9ca3af}
.wk-row-head{border-right:1px solid #1f2937;font-size:14px}
.wk-val{font-size:16px;font-weight:900;justify-content:flex-end;padding-right:8px}

/* ── Voice box ── */
.vbox{background:#0a0a0a;border:1px solid #374151;border-radius:6px;padding:12px;margin-bottom:10px}
.vbox textarea{width:100%;border:none;background:transparent;font-size:18px;font-family:'Noto Sans KR',sans-serif;font-weight:700;resize:none;outline:none;color:#d1d5db;line-height:1.5}
.vbox textarea::placeholder{color:#9ca3af;font-size:18px}
.vbtns{display:flex;gap:8px;margin-top:10px}
.vb{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:13px 8px;border:none;border-radius:6px;font-size:17px;font-weight:900;font-family:'Noto Sans KR',sans-serif;cursor:pointer}
.vb-mic{background:#1f2937;color:#fff;border:1px solid #374151}
.vb-mic.on{background:#991b1b;border-color:#991b1b}
.vb-ai{background:#fbbf24;color:#000}
.vb-ai:disabled{background:#374151;color:#9ca3af;cursor:not-allowed}

/* ── Parsed preview ── */
.pi{background:#0f1a2a;border:1px solid #1e3a5f;border-radius:6px;padding:12px;margin-bottom:8px}
.pi-row{display:flex;justify-content:space-between;margin-bottom:6px;font-size:17px}
.pi-lbl{color:#9ca3af;font-weight:700}
.pi-val{font-weight:900;color:#93c5fd}

/* ── Forms ── */
.fg{margin-bottom:10px}
.fg label{display:block;font-size:17px;font-weight:700;color:#9ca3af;margin-bottom:5px}
.fg input,.fg select{width:100%;padding:12px;border:1px solid #374151;border-radius:6px;font-size:18px;font-family:'Noto Sans KR',sans-serif;font-weight:700;background:#111827;color:#fff}
.fg input:focus,.fg select:focus{outline:none;border-color:#fbbf24}
.fg input::placeholder{color:#9ca3af;font-weight:400}
.fg select option{background:#111827}
.fg2{display:flex;gap:8px}
.fg2 .fg{flex:1}

/* ── Buttons ── */
.btn{width:100%;padding:14px;border:none;border-radius:6px;font-size:19px;font-weight:900;font-family:'Noto Sans KR',sans-serif;cursor:pointer;margin-bottom:6px;display:block}
.btn-navy{background:#fbbf24;color:#000}
.btn-green{background:#166534;color:#4ade80;border:1px solid #16a34a}
.btn-red-full{background:#991b1b;color:#fff}
.btn-outline{background:transparent;border:1px solid #374151;color:#9ca3af}
.btn-sm{display:inline-block;padding:6px 12px;font-size:17px;width:auto;margin:0;border-radius:6px;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:700}
.bsm-red{background:#3f0000;color:#f87171;border:1px solid #7f1d1d}
.bsm-green{background:#052e16;color:#4ade80;border:1px solid #166534}

/* ── List items ── */
.li{display:flex;align-items:flex-start;padding:12px 0;border-bottom:1px solid #1f2937;gap:10px}
.li:last-child{border-bottom:none}
.li-body{flex:1;min-width:0}
.li-title{font-size:18px;font-weight:700;color:#f3f4f6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:17px;font-weight:700;color:#9ca3af;margin-top:3px}
.li-right{text-align:right;flex-shrink:0}
.li-main{font-size:19px;font-weight:900}
.pos{color:#4ade80}
.neg{color:#f87171}
.navy{color:#93c5fd}
.amber{color:#fbbf24}

/* ── Badge ── */
.badge{padding:2px 8px;border-radius:10px;font-size:16px;font-weight:700;display:inline-block;margin-right:2px}
.b-card{background:#1e3a5f;color:#93c5fd}
.b-cash{background:#052e16;color:#4ade80}
.b-credit{background:#431407;color:#fb923c}
.b-debit{background:#3f0000;color:#f87171}

/* ── Section title ── */
.stl{font-size:16px;font-weight:700;color:#9ca3af;letter-spacing:.8px;margin:14px 0 6px;text-transform:uppercase}

/* ── Empty ── */
.empty{text-align:center;padding:28px;color:#9ca3af;font-size:17px;font-weight:700}

/* ── Chart ── */
.chart-wrap{position:relative;height:220px}
.ptabs{display:flex;gap:6px;margin-bottom:12px}
.pt{flex:1;padding:10px 4px;border:1px solid #374151;border-radius:6px;background:transparent;color:#9ca3af;font-size:18px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.pt.on{background:#fbbf24;color:#000;border-color:#fbbf24}

/* ── Profit ── */
#h-profit-val{font-size:32px;font-weight:900;text-align:center;padding:8px 0}

/* ── Spinner ── */
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(0,0,0,.3);border-top-color:#000;border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pulsing{animation:pulse 1s infinite}

/* ── Alert / Confirm Modal ── */
#msg-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:400;align-items:center;justify-content:center}
#msg-box{background:#1f2937;border:1px solid #374151;border-radius:18px;padding:24px 20px 18px;width:268px;text-align:center;animation:popIn .22s cubic-bezier(.34,1.56,.64,1)}
#msg-icon{font-size:30px;margin-bottom:8px}
#msg-text{font-size:17px;font-weight:700;color:#f3f4f6;margin-bottom:18px;line-height:1.55;word-break:keep-all}
#msg-btns{display:flex;gap:8px}
.mb{flex:1;padding:12px 0;border:none;border-radius:10px;font-size:17px;font-weight:900;font-family:'Noto Sans KR',sans-serif;cursor:pointer}
.mb-ok{background:#fbbf24;color:#000}
.mb-cancel{background:#374151;color:#9ca3af}
.mb-del{background:#7f1d1d;color:#fca5a5}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes splashFade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
#splash{position:absolute;inset:0;background:#000;z-index:999;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;animation:splashFade 3s ease-in-out forwards}


/* ── Calendar Modal ── */
#cal-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;align-items:center;justify-content:center}
#cal-box{background:#111827;border:1px solid #374151;border-radius:14px;padding:20px;width:320px}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav{background:none;border:none;color:#9ca3af;font-size:26px;cursor:pointer;padding:2px 12px;line-height:1}
.cal-nav:active{color:#fff}
.cal-month{font-size:20px;font-weight:900;color:#fff}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.cal-dow span{text-align:center;font-size:15px;font-weight:700;padding:5px 0;color:#9ca3af}
#cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
</style>
</head>
<body>

<div id="app">
  <div id="hdr">
    <h1>🍫 초콜릿 운영관리</h1>
    <div id="hdr-sub">
      <span id="today-lbl" onclick="openCal()" style="cursor:pointer"></span>
      <span id="today-btn" onclick="goToday()" style="display:none;font-size:16px;font-weight:700;color:#fbbf24;cursor:pointer">오늘로</span>
    </div>
  </div>
  <div id="content">

    <!-- ═══ HOME ═══ -->
    <div class="page on" id="page-home">
      <div class="stat-table">
        <div class="stat-row"><span class="stat-lbl">당일 매출</span><span class="stat-val amber" id="h-sales">-</span></div>
        <div class="stat-row"><span class="stat-lbl">당일 매입</span><span class="stat-val red"   id="h-purch">-</span></div>
        <div class="stat-row"><span class="stat-lbl">외상 잔액</span><span class="stat-val blue"  id="h-cred">-</span></div>
      </div>
      <div class="card">
        <div class="card-ttl">당일 손익 (매출 - 매입)</div>
        <div id="h-profit-val">-</div>
        <div style="text-align:center;font-size:16px;color:#aaa;margin-top:4px" id="h-profit-sub"></div>
      </div>
      <div class="stl">최근 거래</div>
      <div class="card" id="home-list"></div>
    </div>

    <!-- ═══ 매출 ═══ -->
    <div class="page" id="page-sales">
      <div class="card">
        <div class="card-ttl">🎤 AI 음성 입력</div>
        <div class="vbox">
          <textarea id="sales-ta" rows="4" placeholder="말하거나 직접 입력하세요.
예) 오늘 고객1 카드 80만원 현금 20만원
    고객2 합계 50만원 외상 30만원"></textarea>
          <div class="vbtns">
            <button class="vb vb-mic" id="mic-sales" onclick="toggleMic('sales')">🎤 말하기</button>
            <button class="vb vb-ai"  id="ai-sales"  onclick="parseAI('sales')">✨ AI 파싱</button>
          </div>
        </div>
        <div id="sales-parsed"></div>
      </div>
      <div class="card" id="s-form-card" style="display:none">
        <div id="s-edit-banner" style="display:none;background:#1a3a2a;border:1px solid #166534;border-radius:8px;padding:10px 14px;margin-bottom:12px">
          <span class="pulsing" style="color:#4ade80;font-size:17px;font-weight:700">🔧 매출 수정 중</span>
        </div>
        <div class="card-ttl" id="s-form-ttl">직접 입력</div>
        <div class="fg2">
          <div class="fg"><label>날짜</label><input type="text" id="s-date" readonly onclick="openCalFor('s-date')" placeholder="날짜 선택" style="cursor:pointer"></div>
          <div class="fg"><label>고객명</label><input type="text" id="s-cust" placeholder="고객명"></div>
        </div>
        <div class="fg2">
          <div class="fg"><label>카드</label><input type="text" inputmode="numeric" id="s-card" placeholder="0" oninput="calcTotal()"></div>
          <div class="fg"><label>현금</label><input type="text" inputmode="numeric" id="s-cash" placeholder="0" oninput="calcTotal()"></div>
        </div>
        <div class="fg2">
          <div class="fg"><label>외상</label><input type="text" inputmode="numeric" id="s-cred" placeholder="0" oninput="calcTotal()"></div>
          <div class="fg"><label>합계</label><input type="text" id="s-total" placeholder="자동" readonly style="background:#111827;color:#4ade80;font-size:22px;font-weight:900"></div>
        </div>
        <div class="fg"><label>메모</label><input type="text" id="s-memo" placeholder="메모"></div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-navy" id="s-save-btn" onclick="addSale()" style="flex:1">매출 저장</button>
          <button id="s-cancel-btn" onclick="exitSaleEditMode()" style="display:none;flex:0 0 90px;background:#374151;color:#e5e7eb;border:none;border-radius:8px;font-size:18px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif">취소</button>
        </div>
      </div>
      <div class="stl">매출 내역</div>
      <div class="card" id="sales-list"></div>
    </div>

    <!-- ═══ 매입 ═══ -->
    <div class="page" id="page-purchase">
      <div class="card">
        <div class="card-ttl">🎤 AI 음성 입력</div>
        <div class="vbox">
          <textarea id="purch-ta" rows="4" placeholder="말하거나 직접 입력하세요.
예) 대선주류 주류 음료 백만원 카드
    시장 안주 오십만원 현금"></textarea>
          <div class="vbtns">
            <button class="vb vb-mic" id="mic-purchase" onclick="toggleMic('purchase')">🎤 말하기</button>
            <button class="vb vb-ai"  id="ai-purchase"  onclick="parseAI('purchase')">✨ AI 파싱</button>
          </div>
        </div>
        <div id="purch-parsed"></div>
      </div>
      <div class="card" id="p-form-card" style="display:none">
        <div id="p-edit-banner" style="display:none;background:#1a3a2a;border:1px solid #166534;border-radius:8px;padding:10px 14px;margin-bottom:12px">
          <span class="pulsing" style="color:#4ade80;font-size:17px;font-weight:700">🔧 매입 수정 중</span>
        </div>
        <div class="card-ttl" id="p-form-ttl">직접 입력</div>
        <div class="fg2">
          <div class="fg"><label>날짜</label><input type="text" id="p-date" readonly onclick="openCalFor('p-date')" placeholder="날짜 선택" style="cursor:pointer"></div>
          <div class="fg"><label>거래처명</label><input type="text" id="p-vendor" placeholder="거래처명"></div>
        </div>
        <div class="fg2">
          <div class="fg"><label>품목</label><input type="text" id="p-cat" placeholder="주류,음료"></div>
          <div class="fg"><label>구분</label>
            <select id="p-pay"><option value="card">카드</option><option value="cash">현금</option></select>
          </div>
        </div>
        <div class="fg"><label>금액</label><input type="text" inputmode="numeric" id="p-amt" placeholder="0" oninput="fmtNum(this)"></div>
        <div class="fg"><label>메모</label><input type="text" id="p-memo" placeholder="메모"></div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-navy" id="p-save-btn" onclick="addPurchase()" style="flex:1">매입 저장</button>
          <button id="p-cancel-btn" onclick="exitPurchEditMode()" style="display:none;flex:0 0 90px;background:#374151;color:#e5e7eb;border:none;border-radius:8px;font-size:18px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif">취소</button>
        </div>
      </div>
      <div class="stl">매입 내역</div>
      <div class="card" id="purch-list"></div>
    </div>

    <!-- ═══ 외상 ═══ -->
    <div class="page" id="page-credit">
      <div class="card">
        <div class="card-ttl">고객별 외상 현황</div>
        <div id="cred-summary"></div>
      </div>
      <div class="card" id="pay-form">
        <div class="card-ttl">변제 입력</div>
        <div class="fg2">
          <div class="fg"><label>날짜</label><input type="text" id="pay-date" readonly onclick="openCalFor('pay-date')" placeholder="날짜 선택" style="cursor:pointer"></div>
          <div class="fg"><label>고객명</label><input type="text" id="pay-name" placeholder="고객명"></div>
        </div>
        <div class="fg2">
          <div class="fg"><label>카드</label><input type="text" inputmode="numeric" id="pay-card" placeholder="0" oninput="calcPayTotal()"></div>
          <div class="fg"><label>현금</label><input type="text" inputmode="numeric" id="pay-cash" placeholder="0" oninput="calcPayTotal()"></div>
        </div>
        <div class="fg2">
          <div class="fg"><label>외상잔액</label><input type="text" id="pay-cred-bal" placeholder="0" readonly style="background:#1f2937;color:#9ca3af"></div>
          <div class="fg"><label>합계</label><input type="text" id="pay-total" placeholder="자동" readonly style="background:#111827;color:#4ade80;font-size:22px;font-weight:900"></div>
        </div>
        <div id="pay-warn" style="display:none;color:#f87171;font-size:22px;font-weight:900;text-align:center;padding:10px 0 6px"></div>
        <button class="btn btn-green" id="pay-btn" onclick="addPayment()">변제 처리</button>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px">
        <span class="stl" style="margin:0">외상 거래 내역</span>
        <label style="display:flex;align-items:center;gap:6px;font-size:15px;color:#9ca3af;cursor:pointer">
          <input type="checkbox" id="show-all-cred" onchange="renderCredit()">완제포함
        </label>
      </div>
      <div class="card" id="cred-list"></div>
    </div>

    <!-- ═══ 분석 ═══ -->
    <div class="page" id="page-analysis">
      <div class="ptabs">
        <button class="pt on" id="pt-daily"   onclick="switchPeriod('daily',this)">일별</button>
        <button class="pt"    id="pt-weekly"  onclick="switchPeriod('weekly',this)">주간</button>
        <button class="pt"    id="pt-monthly" onclick="switchPeriod('monthly',this)">월별</button>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 2px 6px">
        <button onclick="shiftAnalysis(-1)" style="background:#1f2937;border:1px solid #374151;color:#e5e7eb;width:40px;height:40px;border-radius:8px;font-size:22px;cursor:pointer;flex-shrink:0">‹</button>
        <span id="analysis-period-lbl" style="font-size:15px;font-weight:700;color:#e5e7eb;text-align:center;flex:1;padding:0 4px"></span>
        <button onclick="shiftAnalysis(1)"  style="background:#1f2937;border:1px solid #374151;color:#e5e7eb;width:40px;height:40px;border-radius:8px;font-size:22px;cursor:pointer;flex-shrink:0">›</button>
      </div>
      <div class="card">
        <div class="card-ttl" id="chart-title">최근 14일</div>
        <div class="chart-wrap"><canvas id="main-chart"></canvas></div>
      </div>
      <div id="stat-area">
        <div class="stat-table">
          <div class="stat-row"><span class="stat-lbl" id="as1-l">기간 매출</span><span class="stat-val amber" id="as1-v">-</span></div>
          <div class="stat-row"><span class="stat-lbl" id="as2-l">기간 매입</span><span class="stat-val red"   id="as2-v">-</span></div>
          <div class="stat-row"><span class="stat-lbl" id="as3-l">순이익</span>  <span class="stat-val blue"  id="as3-v">-</span></div>
        </div>
      </div>

  </div><!-- /content -->

  <div id="tabbar">
    <div class="tab on" data-p="home">    <div class="ti">📊</div><div class="tl">홈</div></div>
    <div class="tab" data-p="sales">      <div class="ti">💰</div><div class="tl">매출</div></div>
    <div class="tab" data-p="purchase">   <div class="ti">🛒</div><div class="tl">매입</div></div>
    <div class="tab" data-p="credit">     <div class="ti">📋</div><div class="tl">외상</div></div>

<div id="msg-overlay">
  <div id="msg-box">

</div>

  <div id="cal-box">
    <div class="cal-hdr">
      <button class="cal-nav" onclick="prevMonth()">‹</button>
      <div class="cal-month" id="cal-title"></div>
      <button class="cal-nav" onclick="nextMonth()">›</button>

      <span style="color:#f87171">일</span>
      <span>월</span><span>화</span><span>수</span><span>목</span><span>금</span>
      <span style="color:#93c5fd">토</span>
    </div>
    <div id="cal-grid"></div>

<script>
// ── DATA ──────────────────────────────────
const API = '/chocolate/api';
async function getSales()  { const r=await fetch(`${API}/sales`);  return r.ok?await r.json():[]; }
async function getPurchs() { const r=await fetch(`${API}/purchases`); return r.ok?await r.json():[]; }
async function getCreds()  { const r=await fetch(`${API}/credits`); return r.ok?await r.json():[]; }

// ── UTILS ─────────────────────────────────
const won = n  => Number(n||0).toLocaleString('ko-KR')+'원';
const numK = n => { const a=Math.abs(n||0); return a>=10000?(n<0?'-':'')+Math.round(Math.abs(n||0)/10000).toLocaleString('ko-KR')+'만':Number(n||0).toLocaleString('ko-KR'); };
function fmtNum(el){const r=el.value.replace(/[^0-9]/g,'');el.value=r?Number(r).toLocaleString('ko-KR'):'';}
function parseNum(v){return parseInt((v||'').replace(/,/g,''))||0;}
function today() {
  return new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});
}
let selectedDate=today();
const uid  = () => Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const $    = s  => document.querySelector(s);
const dl   = d  => (d||'').replace(/-/g,'.');
const pad2 = n  => String(n).padStart(2,'0');
const fmtDate = d => {if(!d)return'';const[y,m,dy]=d.split('-').map(Number);return`${y}년 ${m}월 ${dy}일`;};
let _calTarget=null;

// ── NAV ───────────────────────────────────
let curPage='home', chartInst=null;
document.querySelectorAll('.tab').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.p)));

function updateAnalysisHeader(){
  const dt=analysisDateObj(),y=dt.getFullYear(),mo=dt.getMonth()+1,d=dt.getDate(),dw=dt.getDay();
  const DW=['일','월','화','수','목','금','토'];
  const DC=['#f87171','#e5e7eb','#e5e7eb','#e5e7eb','#e5e7eb','#e5e7eb','#93c5fd'];
  let html='';
  if(_analysisPeriod==='weekly'){
    const sun=new Date(dt);sun.setDate(d-dw);
    const sat=new Date(sun);sat.setDate(sun.getDate()+6);
    html=`<span style="font-size:17px;font-weight:900;color:#e5e7eb">`+
         `${sun.getFullYear()}년 ${sun.getMonth()+1}월 ${sun.getDate()}일 ~ ${sat.getMonth()+1}월 ${sat.getDate()}일</span>`;
  }else if(_analysisPeriod==='monthly'){
    html=`<span style="font-size:20px;font-weight:900;color:#e5e7eb">${y}년 ${mo}월</span>`;
  }else{
    html=`<span style="font-size:20px;font-weight:900;color:#e5e7eb">${y}년 ${mo}월 ${d}일</span>`+
         `<span style="font-size:20px;font-weight:900;color:${DC[dw]};margin-left:4px">(${DW[dw]})</span>`;
  }
  $('#today-lbl').innerHTML=html;
  $('#today-btn').style.display='none';
}
function navigate(p) {
  curPage=p;
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on',el.dataset.p===p));
  document.querySelectorAll('.page').forEach(el=>el.classList.toggle('on',el.id==='page-'+p));
  if(p==='home')     { updateDateLabel(); renderHome(); }
  if(p==='sales')    { updateDateLabel(); renderSales(); }
  if(p==='purchase') { updateDateLabel(); renderPurchase(); }
  if(p==='credit')   { updateDateLabel(); renderCredit(); }
  if(p==='analysis'){
    analysisDate=selectedDate;
    document.querySelectorAll('.pt').forEach((b,i)=>b.classList.toggle('on',['daily','weekly','monthly'][i]===_analysisPeriod));
    renderAnalysis();
    updateAnalysisHeader();
  }
}

async function apiPost(path, body) {
  const r = await fetch(`${API}${path}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if(!r.ok) throw new Error('API 오류');
  return r.json();
}
async function apiDel(path) {
  const r = await fetch(`${API}${path}`, {method:'DELETE'});
  if(!r.ok) throw new Error('API 오류');
  return r.json();
}

// ── HOME ──────────────────────────────────
async function renderHome() {
  const [sales,purch,creds]=[await getSales(),await getPurchs(),await getCreds()], t=selectedDate;
  const sTotal=sales.filter(s=>s.date===t).reduce((a,s)=>a+(s.card||0)+(s.cash||0),0)
             +creds.filter(c=>c.date===t&&c.type==='credit').reduce((a,c)=>a+c.amount,0);
  const pTotal=purch.filter(p=>p.date===t).reduce((a,p)=>a+(p.amount||0),0);
  const cBal=creds.filter(c=>c.type==='debit').reduce((a,c)=>a+c.amount,0)
            -creds.filter(c=>c.type==='credit').reduce((a,c)=>a+c.amount,0);
  const profit=sTotal-pTotal;
  $('#h-sales').textContent=won(sTotal);
  $('#h-purch').textContent=won(pTotal);
  $('#h-cred').textContent=won(cBal);
  const pEl=$('#h-profit-val');
  pEl.textContent=(profit>=0?'+':'')+won(profit);
  pEl.className=profit>=0?'pos':'neg';
  pEl.style.cssText='font-size:32px;font-weight:700;text-align:center;padding:8px 0';
  $('#h-profit-sub').textContent=`매출 ${won(sTotal)} · 매입 ${won(pTotal)}`;

  const [sy,sm,sd]=t.split('-').map(Number);
  const dtFrom=new Date(sy,sm-1,sd);dtFrom.setDate(dtFrom.getDate()-13);
  const dateFrom=`${dtFrom.getFullYear()}-${pad2(dtFrom.getMonth()+1)}-${pad2(dtFrom.getDate())}`;
  const all=[
    ...sales.map(s=>({...s,_t:'sale'})),
    ...purch.map(p=>({...p,_t:'purch'}))
  ].filter(x=>x.date>=dateFrom&&x.date<=t)
   .sort((a,b)=>b.date.localeCompare(a.date)||(b.id||'').localeCompare(a.id||'')).slice(0,8);

  $('#home-list').innerHTML=all.length===0
    ?`<div class="empty">거래 내역이 없습니다</div>`
    :all.map(x=>x._t==='sale'
      ?`<div class="li">
          <div class="li-body">
            <div class="li-title">💰 ${x.customer||'고객'}</div>
            <div class="li-sub">${dl(x.date)}${x.memo?' · '+x.memo:''}</div>
            <div class="li-sub" style="margin-top:3px">
              ${x.card?`<span class="badge b-card">카드 ${won(x.card)}</span>`:''}
              ${x.cash?`<span class="badge b-cash">현금 ${won(x.cash)}</span>`:''}
              ${x.credit?`<span class="badge b-credit">외상 ${won(x.credit)}</span>`:''}
            </div>
          </div>
          <div class="li-right"><div class="li-main pos">+${won(x.total||0)}</div></div>
        </div>`
      :`<div class="li">
          <div class="li-body">
            <div class="li-title">🛒 ${x.vendor||''} <span style="font-weight:400;color:#888">${x.category||''}</span></div>
            <div class="li-sub">${dl(x.date)} · <span class="badge ${x.payment==='card'?'b-card':'b-cash'}">${x.payment==='card'?'카드':'현금'}</span></div>
          </div>
          <div class="li-right"><div class="li-main neg">-${won(x.amount||0)}</div></div>
        </div>`
    ).join('');
}

// ── SALES ─────────────────────────────────
function calcTotal() {
  ['s-card','s-cash','s-cred'].forEach(id=>fmtNum($('#'+id)));
  const v=parseNum($('#s-card').value)+parseNum($('#s-cash').value)+parseNum($('#s-cred').value);
  $('#s-total').value=v?v.toLocaleString('ko-KR'):'';
}

async function addSale(data) {
  const d=data||{
    date:$('#s-date').dataset.date||$('#s-date').value, customer:$('#s-cust').value.trim()||'고객',
    card:parseNum($('#s-card').value), cash:parseNum($('#s-cash').value),
    credit:parseNum($('#s-cred').value), memo:$('#s-memo').value.trim()
  };
  if(!d.date){await showAlert('날짜를 입력하세요','📅');return;}
  d.total=(d.card||0)+(d.cash||0)+(d.credit||0);
  if(!d.total){await showAlert('금액을 입력하세요','💰');return;}
  try {
    if(_saleEditId){
      d.id=_saleEditId;
      // 외상 변경 시 잔액 초과 여부 확인
      if((d.credit||0) !== _saleOrigCredit) {
        const creds=await getCreds();
        const nm=_saleOrigCustomer||d.customer;
        const totDeb=creds.filter(c=>c.name===nm&&c.type==='debit').reduce((a,c)=>a+c.amount,0);
        const totPaid=creds.filter(c=>c.name===nm&&c.type==='credit').reduce((a,c)=>a+c.amount,0);
        const newBal=totDeb - _saleOrigCredit + (d.credit||0) - totPaid;
        if(newBal<0){
          const over=Math.abs(newBal).toLocaleString('ko-KR');
          const ok=await showConfirm(`변제액이 ${over}원 초과됩니다.\n그래도 수정하시겠습니까?`,'⚠️','수정','mb-ok');
          if(!ok)return;
        }
      }
      await fetch(`${API}/sales/${_saleEditId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
      exitSaleEditMode();
      await renderSales(); showV('✅ 매출 수정 완료');
    } else {
      d.id=uid();
      await apiPost('/sales', d);
      if((d.credit||0)>0){
        await apiPost('/credits',{id:uid(),name:d.customer,date:d.date,amount:d.credit,type:'debit',memo:'매출 외상',sale_id:d.id});
      }
      ['s-cust','s-card','s-cash','s-cred','s-memo'].forEach(id=>{const e=$('#'+id);if(e)e.value='';});
      $('#s-total').value='';
      await renderSales(); showV('✅ 매출 저장: '+won(d.total));
    }
    return true;
  } catch(e) { await showAlert('저장 실패: '+e.message,'❌'); }
}

async function delSale(id){
  const sale=_saleRows[id];
  if(sale&&(sale.credit||0)>0){
    const creds=await getCreds();
    const nm=sale.customer;
    const totDeb=creds.filter(c=>c.name===nm&&c.type==='debit').reduce((a,c)=>a+c.amount,0);
    const totPaid=creds.filter(c=>c.name===nm&&c.type==='credit').reduce((a,c)=>a+c.amount,0);
    const newBal=(totDeb-(sale.credit||0))-totPaid;
    if(newBal<0){
      const ok=await showConfirm(
        `${nm} 고객의 변제액이 ${won(Math.abs(newBal))} 초과됩니다.\n매출 삭제 시 외상 잔액이 음수가 됩니다.\n계속하시겠습니까?`,
        '⚠️','삭제','mb-del');
      if(!ok)return;
    } else {
      if(!await showConfirm('매출을 삭제할까요?'))return;
    }
  } else {
    if(!await showConfirm('매출을 삭제할까요?'))return;
  }
  await apiDel('/sales/'+id);renderSales();
}

const _saleRows={};
async function renderSales() {
  if(!$('#s-date').dataset.date){$('#s-date').dataset.date=selectedDate;$('#s-date').value=fmtDate(selectedDate);}
  const all=[...await getSales()].sort((a,b)=>b.date.localeCompare(a.date));
  all.forEach(s=>{_saleRows[s.id]=s;});
  const [sy,sm,sd]=selectedDate.split('-').map(Number);
  const _sf=new Date(sy,sm-1,sd);_sf.setDate(_sf.getDate()-13);
  const _sfrom=`${_sf.getFullYear()}-${pad2(_sf.getMonth()+1)}-${pad2(_sf.getDate())}`;
  const list=all.filter(s=>s.date>=_sfrom&&s.date<=selectedDate);
  $('#sales-list').innerHTML=list.length===0?`<div class="empty">${fmtDate(selectedDate)} 기준 14일 매출 없음</div>`
    :list.map(s=>`<div class="li">
      <div class="li-body">
        <div class="li-title">${dl(s.date)} <strong>${s.customer||'고객'}</strong></div>
        <div class="li-sub" style="margin-top:4px">
          ${s.card?`<span class="badge b-card">카드 ${won(s.card)}</span>`:''}
          ${s.cash?`<span class="badge b-cash">현금 ${won(s.cash)}</span>`:''}
          ${s.credit?`<span class="badge b-credit">외상 ${won(s.credit)}</span>`:''}
        </div>
        ${s.memo?`<div class="li-sub">${s.memo}</div>`:''}
      </div>
      <div class="li-right">
        <div class="li-main pos">${won(s.total||0)}</div>
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="btn-sm bsm-green" onclick="_saleRows['${s.id}']&&enterSaleEditMode(_saleRows['${s.id}'])">수정</button>
          <button class="btn-sm bsm-red" onclick="delSale('${s.id}')">삭제</button>
        </div>
      </div>
    </div>`).join('');
}

// ── PURCHASE ──────────────────────────────
async function addPurchase(data) {
  const d=data||{
    date:$('#p-date').dataset.date||$('#p-date').value, vendor:$('#p-vendor').value.trim(),
    category:$('#p-cat').value.trim(), amount:parseNum($('#p-amt').value),
    payment:$('#p-pay').value, memo:$('#p-memo').value.trim()
  };
  if(!d.date){await showAlert('날짜를 입력하세요','📅');return;}
  if(!d.amount){await showAlert('금액을 입력하세요','💰');return;}
  try {
    if(_purchEditId){
      d.id=_purchEditId;
      await fetch(`${API}/purchases/${_purchEditId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
      exitPurchEditMode();
      await renderPurchase(); showV('✅ 매입 수정 완료');
    } else {
      d.id=uid();
      await apiPost('/purchases', d);
      ['p-vendor','p-cat','p-amt','p-memo'].forEach(id=>{const e=$('#'+id);if(e)e.value='';});
      await renderPurchase(); showV('✅ 매입 저장: '+(d.vendor||'')+' '+won(d.amount));
    }
    return true;
  } catch(e) { await showAlert('저장 실패: '+e.message,'❌'); }
}

async function delPurchase(id){if(!await showConfirm('매입을 삭제할까요?'))return;await apiDel('/purchases/'+id);renderPurchase();}

const _purchRows={};
async function renderPurchase() {
  if(!$('#p-date').dataset.date){$('#p-date').dataset.date=selectedDate;$('#p-date').value=fmtDate(selectedDate);}
  const all=[...await getPurchs()].sort((a,b)=>b.date.localeCompare(a.date));
  all.forEach(p=>{_purchRows[p.id]=p;});
  const [py,pm,pd]=selectedDate.split('-').map(Number);
  const _pf=new Date(py,pm-1,pd);_pf.setDate(_pf.getDate()-13);
  const _pfrom=`${_pf.getFullYear()}-${pad2(_pf.getMonth()+1)}-${pad2(_pf.getDate())}`;
  const list=all.filter(p=>p.date>=_pfrom&&p.date<=selectedDate);
  $('#purch-list').innerHTML=list.length===0?`<div class="empty">${fmtDate(selectedDate)} 기준 14일 매입 없음</div>`
    :list.map(p=>`<div class="li">
      <div class="li-body">
        <div class="li-title">${dl(p.date)} <strong>${p.vendor||'미상'}</strong>${p.category?' <span style="color:#888;font-weight:400">'+p.category+'</span>':''}</div>
        <div class="li-sub" style="margin-top:4px">
          <span class="badge ${p.payment==='card'?'b-card':'b-cash'}">${p.payment==='card'?'카드':'현금'}</span>
        </div>
        ${p.memo?`<div class="li-sub">${p.memo}</div>`:''}
      </div>
      <div class="li-right">
        <div class="li-main neg">-${won(p.amount||0)}</div>
        <div style="display:flex;gap:6px;margin-top:6px">
          <button class="btn-sm bsm-green" onclick="_purchRows['${p.id}']&&enterPurchEditMode(_purchRows['${p.id}'])">수정</button>
          <button class="btn-sm bsm-red" onclick="delPurchase('${p.id}')">삭제</button>
        </div>
      </div>
    </div>`).join('');
}

// ── CREDIT ────────────────────────────────
function calcPayTotal(){
  ['pay-card','pay-cash'].forEach(id=>fmtNum($('#'+id)));
  const v=parseNum($('#pay-card').value)+parseNum($('#pay-cash').value);
  $('#pay-total').value=v?v.toLocaleString('ko-KR'):'';
  const bal=parseNum($('#pay-cred-bal').value);
  const warn=$('#pay-warn'), btn=$('#pay-btn');
  if(bal>0&&v>bal){
    const over=v-bal;
    warn.textContent=`⚠️ 변제금액 ${over.toLocaleString('ko-KR')}원 초과`;
    warn.style.display='block';
    btn.disabled=true;btn.style.opacity='.4';
  } else {
    warn.style.display='none';
    btn.disabled=false;btn.style.opacity='1';
  }
}
function selectCreditor(name,bal){
  $('#pay-name').value=name;
  $('#pay-cred-bal').value=bal.toLocaleString('ko-KR');
  $('#pay-total').value='';
  $('#pay-card').value='';$('#pay-cash').value='';
  $('#pay-form').scrollIntoView({behavior:'smooth',block:'start'});
}
async function addPayment() {
  const name=$('#pay-name').value.trim(), date=$('#pay-date').dataset.date||$('#pay-date').value,
        card=parseNum($('#pay-card').value), cash=parseNum($('#pay-cash').value),
        amount=card+cash;
  if(!name){await showAlert('고객명을 입력하세요','👤');return;}
  if(!date){await showAlert('날짜를 입력하세요','📅');return;}
  if(!amount){await showAlert('금액을 입력하세요','💰');return;}
  const bal=parseNum($('#pay-cred-bal').value);
  if(bal>0&&amount>bal)return;
  try {
    await apiPost('/credits',{id:uid(),name,date,amount,type:'credit',memo:''});
    ['pay-card','pay-cash','pay-total','pay-cred-bal'].forEach(id=>{const e=$('#'+id);if(e)e.value='';});
    await renderCredit(); showV('✅ '+name+' 변제 '+won(amount));
  } catch(e) { await showAlert('저장 실패: '+e.message,'❌'); }
}

async function renderCredit() {
  if(!$('#pay-date').dataset.date){$('#pay-date').dataset.date=selectedDate;$('#pay-date').value=fmtDate(selectedDate);}
  const cr=await getCreds(), allNames=[...new Set(cr.map(c=>c.name))];
  const balMap={};
  allNames.forEach(n=>{
    const deb=cr.filter(c=>c.name===n&&c.type==='debit').reduce((a,c)=>a+c.amount,0);
    const pd=cr.filter(c=>c.name===n&&c.type==='credit').reduce((a,c)=>a+c.amount,0);
    balMap[n]=deb-pd;
  });
  const misuNames=allNames.filter(n=>balMap[n]>0);
  $('#cred-summary').innerHTML=misuNames.length===0?`<div class="empty">미수 외상이 없습니다</div>`
    :misuNames.map(n=>{
      const deb=cr.filter(c=>c.name===n&&c.type==='debit').reduce((a,c)=>a+c.amount,0);
      const pd=cr.filter(c=>c.name===n&&c.type==='credit').reduce((a,c)=>a+c.amount,0);
      return `<div class="li" style="cursor:pointer" onclick="selectCreditor('${n}',${balMap[n]})">
        <div class="li-body">
          <div class="li-title" style="white-space:normal">👤 ${n}</div>
          <div class="li-sub">총 외상 ${won(deb)} · 변제 ${won(pd)}</div>
        </div>
        <div class="li-right">
          <div class="li-main neg">${won(balMap[n])}</div>
          <div style="font-size:16px;color:#f87171">미수</div>
        </div>
      </div>`;
    }).join('');
  const showAll=$('#show-all-cred')?.checked;
  const showNames=showAll?allNames:misuNames;
  $('#cred-list').innerHTML=showNames.length===0?`<div class="empty">거래 내역이 없습니다</div>`
    :showNames.map(n=>{
      const entries=[...cr.filter(c=>c.name===n)].sort((a,b)=>a.date.localeCompare(b.date));
      const debits=entries.filter(c=>c.type==='debit');
      const credits=entries.filter(c=>c.type==='credit');
      const deb=debits.reduce((a,c)=>a+c.amount,0);
      const pd=credits.reduce((a,c)=>a+c.amount,0);
      const bal=deb-pd;
      const memos=debits.filter(c=>c.memo).map(c=>c.memo);
      const debitRows=debits.map(c=>`
        <div style="display:flex;justify-content:space-between;padding:3px 0">
          <span style="color:#9ca3af;font-size:16px">${dl(c.date)}</span>
          <span style="color:#f87171;font-size:17px;font-weight:700">${won(c.amount)}</span>
        </div>`).join('');
      const creditRows=credits.map(c=>`
        <div style="display:flex;justify-content:space-between;padding:3px 0">
          <span style="color:#9ca3af;font-size:16px">${dl(c.date)}</span>
          <span style="color:#4ade80;font-size:17px;font-weight:700">-${won(c.amount)}</span>
        </div>`).join('');
      return `<div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #1f2937">
        <div style="font-size:19px;font-weight:900;color:#fff;margin-bottom:6px">👤 ${n}</div>
        ${debitRows}${creditRows}
        <div style="display:flex;justify-content:flex-end;padding:5px 0 2px;border-top:1px solid #374151;margin-top:4px">
          <span style="color:#fff;font-size:18px;font-weight:900">${won(bal)}</span>
        </div>
        ${memos.length?`<div style="color:#9ca3af;font-size:15px;margin-top:4px">${memos.join(' · ')}</div>`:''}
      </div>`;
    }).join('');
}

// ── ANALYSIS ──────────────────────────────
let analysisDate=today(), _analysisPeriod='daily';

function analysisDateObj(){
  const[y,m,d]=analysisDate.split('-').map(Number);return new Date(y,m-1,d);
}
function updateAnalysisPeriodLabel(){
  const dt=analysisDateObj(),y=dt.getFullYear(),mo=dt.getMonth()+1,d=dt.getDate(),dw=dt.getDay();
  const DW=['일','월','화','수','목','금','토'];
  let lbl='';
  if(_analysisPeriod==='daily'){
    lbl=`${y}년 ${mo}월 ${d}일 (${DW[dw]})`;
  }else if(_analysisPeriod==='weekly'){
    const sun=new Date(dt);sun.setDate(d-dw);
    const sat=new Date(sun);sat.setDate(sun.getDate()+6);
    const sm=sun.getMonth()+1,sd2=sun.getDate(),em=sat.getMonth()+1,ed=sat.getDate();
    lbl=`${sun.getFullYear()}년 ${sm}월 ${sd2}일 ~ ${sat.getFullYear()}년 ${em}월 ${ed}일`;
  }else{
    lbl=`${y}년 ${mo}월`;
  }
  $('#analysis-period-lbl').textContent=lbl;
}
function shiftAnalysis(dir){
  const dt=analysisDateObj();
  if(_analysisPeriod==='daily'){
    dt.setDate(dt.getDate()+dir);
    analysisDate=`${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;
  }else if(_analysisPeriod==='weekly'){
    dt.setDate(dt.getDate()+dir*7);
    analysisDate=`${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;
  }else{
    const nm=new Date(dt.getFullYear(),dt.getMonth()+dir,1);
    analysisDate=`${nm.getFullYear()}-${pad2(nm.getMonth()+1)}-01`;
  }
  updateAnalysisHeader();
  updateAnalysisPeriodLabel();
  renderAnalysis();
}
function switchPeriod(p,btn){
  document.querySelectorAll('.pt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  _analysisPeriod=p;
  updateAnalysisHeader();
  updateAnalysisPeriodLabel();
  renderAnalysis();
}
async function renderAnalysis(p) {
  if(p)_analysisPeriod=p;
  if(chartInst){chartInst.destroy();chartInst=null;}
  updateAnalysisPeriodLabel();
  const [s,pu,cr]=[await getSales(),await getPurchs(),await getCreds()];
  if(_analysisPeriod==='daily')   renderDaily(s,pu,cr);
  else if(_analysisPeriod==='weekly') renderWeekly(s,pu,cr);
  else              renderMonthly(s,pu,cr);
}
function realSales(sales,creds,dateFilter){
  return sales.filter(s=>dateFilter(s.date)).reduce((a,s)=>a+(s.card||0)+(s.cash||0),0)
        +creds.filter(c=>c.type==='credit'&&dateFilter(c.date)).reduce((a,c)=>a+c.amount,0);
}
function renderDaily(sales,purch,creds) {
  $('#chart-title').textContent='최근 14일';
  const now=analysisDateObj();
  const days=Array.from({length:14},(_,i)=>{const d=new Date(now);d.setDate(d.getDate()-(13-i));return`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;});
  const sd=days.map(d=>realSales(sales,creds,dt=>dt===d));
  const pd=days.map(d=>purch.filter(p=>p.date===d).reduce((a,p)=>a+(p.amount||0),0));
  const ss=sd.reduce((a,v)=>a+v,0),ps=pd.reduce((a,v)=>a+v,0);
  setStats('14일 매출',won(ss),'14일 매입',won(ps),'순이익',won(ss-ps),ss>=ps);
  drawChart(days.map(d=>d.slice(5)),sd,pd);
}
function renderWeekly(sales,purch,creds) {
  $('#chart-title').textContent='주간 비교';
  const now=analysisDateObj(),dow=now.getDay();
  const wkDates=(off)=>Array.from({length:7},(_,i)=>{const d=new Date(now);d.setDate(d.getDate()-dow+i+off*7);return`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;});
  const thisDates=wkDates(0),lastDates=wkDates(-1);
  const ss=realSales(sales,creds,d=>thisDates.includes(d));
  const sl=realSales(sales,creds,d=>lastDates.includes(d));
  const ps=thisDates.reduce((a,d)=>a+purch.filter(p=>p.date===d).reduce((b,p)=>b+(p.amount||0),0),0);
  const pl=lastDates.reduce((a,d)=>a+purch.filter(p=>p.date===d).reduce((b,p)=>b+(p.amount||0),0),0);
  const cs=thisDates.reduce((a,d)=>a+sales.filter(s=>s.date===d).reduce((b,s)=>b+(s.credit||0),0),0);
  const cl=lastDates.reduce((a,d)=>a+sales.filter(s=>s.date===d).reduce((b,s)=>b+(s.credit||0),0),0);
  const balance=creds.filter(c=>c.type==='debit').reduce((a,c)=>a+(c.amount||0),0)
               -creds.filter(c=>c.type==='credit').reduce((a,c)=>a+(c.amount||0),0);
  const sign=(v)=>v>=0?'+':'';
  const clr=(v)=>v>=0?'#4ade80':'#f87171';
  $('#stat-area').innerHTML=
    `<div class="stat-table" style="margin-bottom:12px"><div class="stat-row"><span class="stat-lbl">외상 잔액</span><span class="stat-val red">${won(balance)}</span></div></div>`+
    `<div class="wk-grid">`+
      `<div class="wk-row wk-hdr-row"><div class="wk-cell wk-row-head" style="border-right:none"></div><div class="wk-cell wk-col-head">매출</div><div class="wk-cell wk-col-head">매입</div><div class="wk-cell wk-col-head">외상</div></div>`+
      `<div class="wk-row"><div class="wk-cell wk-row-head">전주</div><div class="wk-cell wk-val" style="color:#fbbf24">${numK(sl)}</div><div class="wk-cell wk-val" style="color:#f87171">${numK(pl)}</div><div class="wk-cell wk-val" style="color:#60a5fa">${numK(cl)}</div></div>`+
      `<div class="wk-row"><div class="wk-cell wk-row-head">금주</div><div class="wk-cell wk-val" style="color:#fbbf24">${numK(ss)}</div><div class="wk-cell wk-val" style="color:#f87171">${numK(ps)}</div><div class="wk-cell wk-val" style="color:#60a5fa">${numK(cs)}</div></div>`+
      `<div class="wk-row"><div class="wk-cell wk-row-head">증감</div><div class="wk-cell wk-val" style="color:${clr(ss-sl)}">${sign(ss-sl)+numK(ss-sl)}</div><div class="wk-cell wk-val" style="color:${clr(ps-pl)}">${sign(ps-pl)+numK(ps-pl)}</div><div class="wk-cell wk-val" style="color:${clr(cs-cl)}">${sign(cs-cl)+numK(cs-cl)}</div></div>`+
    `</div>`;
  const sT=thisDates.map(d=>realSales(sales,creds,dt=>dt===d));
  const pT=thisDates.map(d=>purch.filter(p=>p.date===d).reduce((a,p)=>a+(p.amount||0),0));
  drawChart(['일','월','화','수','목','금','토'],sT,pT);
}
function renderMonthly(sales,purch,creds) {
  $('#chart-title').textContent='월별 (6개월)';
  const now=analysisDateObj();
  const mos=Array.from({length:6},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-(5-i),1);return`${d.getFullYear()}-${pad2(d.getMonth()+1)}`;});
  const sd=mos.map(m=>realSales(sales,creds,dt=>dt.startsWith(m)));
  const pd=mos.map(m=>purch.filter(p=>p.date.startsWith(m)).reduce((a,p)=>a+(p.amount||0),0));
  const ss=sd.reduce((a,v)=>a+v,0),ps=pd.reduce((a,v)=>a+v,0);
  setStats('6개월 매출',won(ss),'6개월 매입',won(ps),'순이익',won(ss-ps),ss>=ps);
  drawChart(mos.map(m=>m.slice(5)+'월'),sd,pd);
}

설명 없이 JSON 배열만 반환:
${text}`

async function saveParsed(type,idx) {

  item.id=uid();
  try{
    if(type==='sales'){
      item.total=(item.card||0)+(item.cash||0)+(item.credit||0);
      await apiPost('/sales',item);
      if((item.credit||0)>0)
        await apiPost('/credits',{id:uid(),name:item.customer,date:item.date,amount:item.credit,type:'debit',memo:'매출 외상',sale_id:item.id});
      await renderSales();

      await apiPost('/purchases',item);
      await renderPurchase();

    const el=$(`#pi-${type}-${idx}`);
    if(el)el.remove();
    showV('✅ 저장 완료');

}

function _startRecognition(type){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

    let fin='',inter='';
    for(let i=0;i<e.results.length;i++){
      if(e.results[i].isFinal)fin+=e.results[i][0].transcript;
      else inter+=e.results[i][0].transcript;
    }
    if(fin){_silentCount=0;_finalText=(_finalText+(_finalText?'\n':'')+fin.trim()).trim();}
    ta.value=_finalText+(inter?(_finalText?'\n':'')+inter:'');
    btn.textContent=inter?'🔴 '+inter:'🔴 듣는 중...';
  };
  recognition.onerror=e=>{if(e.error!=='no-speech'){_keepListening=false;stopMic(type);}};
  recognition.onend=()=>{
    if(!_keepListening){stopMic(type);return;}
    _silentCount+=1;
    if(_silentCount>MAX_SILENT){_keepListening=false;stopMic(type);}
    else{try{_startRecognition(type);}catch(err){stopMic(type);}}
  };
  recognition.start();
}
function toggleMic(type){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showAlert('Chrome 또는 Edge에서 사용해 주세요','🌐');return;}
  if(isListening){_keepListening=false;try{recognition.stop();}catch(e){}return;}
  const parsedId=type==='sales'?'sales-parsed':'purch-parsed';
  $('#'+parsedId).innerHTML='';_parsed[type]=[];
  $(type==='sales'?'#sales-ta':'#purch-ta').value='';
  _finalText='';_silentCount=0;_keepListening=true;_micType=type;
  _startRecognition(type);
}
function stopMic(type){
  isListening=false;_keepListening=false;
  const t=_micType||type;
  const btn=$('#mic-'+t);
  if(btn){btn.classList.remove('on','pulsing');btn.textContent='🎤 말하기';}
  _micType=null;
}

// ── DATE LABEL ────────────────────────────
const DOW_KO=['일','월','화','수','목','금','토'];
const DOW_COLOR=['#f87171','#e5e7eb','#e5e7eb','#e5e7eb','#e5e7eb','#e5e7eb','#93c5fd'];

function updateDateLabel() {
  const [y,m,d]=selectedDate.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  const dow=dt.getDay();
  const t=today();
  $('#today-lbl').innerHTML=
    `<span style="font-size:20px;font-weight:900;color:#e5e7eb">${y}년 ${m}월 ${d}일</span>`+
    `<span style="font-size:20px;font-weight:900;color:${DOW_COLOR[dow]};margin-left:4px">(${DOW_KO[dow]})</span>`;
  $('#today-btn').style.display=selectedDate===t?'none':'inline';
}

function goToday(){selectedDate=today();updateDateLabel();refreshCurPage();}

// ── CALENDAR ──────────────────────────────
let calY,calM;

function openCal(){
  _calTarget=null;
  const [y,m]=selectedDate.split('-').map(Number);
  calY=y;calM=m;renderCal();
  $('#cal-modal').style.display='flex';
}
function openCalFor(inputId){
  _calTarget=inputId;
  const el=$('#'+inputId);
  const ref=el.dataset.date||selectedDate;
  const [y,m]=ref.split('-').map(Number);
  calY=y;calM=m;renderCal();
  $('#cal-modal').style.display='flex';
}
function closeCal(){$('#cal-modal').style.display='none';_calTarget=null;}

function renderCal(){
  $('#cal-title').textContent=calY+'년 '+calM+'월';
  const first=new Date(calY,calM-1,1).getDay();
  const last=new Date(calY,calM,0).getDate();
  const t=today();
  let cells='',day=1,total=Math.ceil((first+last)/7)*7;
  for(let i=0;i<total;i++){
    const col=i%7;
    if(i<first||day>last){cells+='<div></div>';continue;}
    const ds=`${calY}-${String(calM).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const selDate=_calTarget?(($('#'+_calTarget)?.dataset.date||selectedDate)):selectedDate;
    const isSel=ds===selDate,isT=ds===t;
    const tc=col===0?'#f87171':col===6?'#93c5fd':'#fff';
    cells+=`<div onclick="selectDate('${ds}')" style="text-align:center;padding:10px 2px;cursor:pointer;border-radius:8px;font-size:19px;font-weight:900;color:${isSel?'#000':tc};background:${isSel?'#fbbf24':isT?'#1f2937':'transparent'};border:1px solid ${isT&&!isSel?'#fbbf24':'transparent'}">${day}</div>`;
    day++;
  }
  $('#cal-grid').innerHTML=cells;
}

function refreshCurPage(){
  if(curPage==='home')renderHome();
  else if(curPage==='sales')renderSales();
  else if(curPage==='purchase')renderPurchase();
  else if(curPage==='credit')renderCredit();
}
function selectDate(ds){
  if(_calTarget){
    const el=$('#'+_calTarget);
    el.dataset.date=ds;el.value=fmtDate(ds);
    _calTarget=null;closeCal();
  } else {
    selectedDate=ds;closeCal();updateDateLabel();refreshCurPage();
  }
}
function prevMonth(){calM--;if(calM<1){calM=12;calY--;}renderCal();}
function nextMonth(){calM++;if(calM>12){calM=1;calY++;}renderCal();}

function showSplash(){

  sp.innerHTML='<img src="/chocolate/chocolate_kyeonghee_512_v4.png" style="width:260px;height:260px;border-radius:52px">';
  document.getElementById('app').prepend(sp);
  setTimeout(()=>{if(sp.parentNode)sp.remove();},3100);
}
let _hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){_hiddenAt=Date.now();}
  else if(_hiddenAt>0&&Date.now()-_hiddenAt>5000){showSplash();}
});
